name: Check and publish scenarios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version number is the commit count
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scenarios and build the library
        run: python3 tools/publish.py
      - name: Check source links (warning only)
        run: python3 tools/publish.py --check-links || echo "::warning::Some source links didn't respond. Check the log above."
      - name: Package site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
